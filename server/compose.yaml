name: yaga

services:
  server:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Bucharest # get_current_time reports this zone
    volumes:
      - threads:/app/.agent_threads # chat history survives rebuilds
    ports:
      - "8081:8080" # host 8081: zaveit already uses 8080

volumes:
  threads:
